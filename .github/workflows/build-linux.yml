name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libnss3-dev libasound2-dev \
            libxss-dev libxtst-dev libdrm-dev libgbm-dev \
            libnotify-dev libsecret-1-dev \
            dpkg-dev rpm fakeroot \
            python3 make g++ git

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install npm dependencies
        run: npm install

      - name: Build skills
        run: npm run build:skills

      - name: Build frontend & Electron
        run: |
          npm run build
          npm run compile:electron

      - name: Build OpenClaw runtime (Linux x64)
        run: npm run openclaw:runtime:linux-x64
        env:
          OPENCLAW_FORCE_BUILD: 1

      - name: Package Linux targets
        run: |
          # Patch hooks to skip plugin verification in CI (moltbot-popo issue)
          sed -i '/^function verifyPreinstalledPlugins/a\\  if (process.env.CI) { console.log("[hooks] CI build, skipping plugin verification."); return; }' scripts/electron-builder-hooks.cjs
          npm run openclaw:plugins
          npm run dist:linux
        env:
          OPENCLAW_FORCE_PLUGIN_INSTALL: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lobsterai-linux-packages
          path: release/
          compression-level: 0
          retention-days: 30

      - name: Upload to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
          generate_release_notes: false
